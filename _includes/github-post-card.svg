{%- assign post = site.posts[page.post_index] -%}
{%- assign title = post.title | strip_html | normalize_whitespace -%}
{%- assign visible_title = title | truncate: 56, '…' -%}
{%- assign first_line = visible_title | slice: 0, 28 -%}
{%- assign second_line = visible_title | slice: 28, 28 -%}
{%- assign card_height = 88 -%}
{%- assign metadata_y = 65 -%}
{%- if second_line != empty -%}
  {%- assign card_height = 114 -%}
  {%- assign metadata_y = 91 -%}
{%- endif -%}
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="{{ card_height }}" viewBox="0 0 640 {{ card_height }}" role="img" aria-labelledby="title desc">
  <title id="title">{{ title | xml_escape }}</title>
  <desc id="desc">{{ post.date | date: '%Y.%m.%d' }} · Choi's dev-log</desc>
  <rect x="0.5" y="0.5" width="639" height="{{ card_height | minus: 1 }}" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <text x="24" y="35" fill="#1f2328" font-size="18" font-weight="600">{{ first_line | xml_escape }}</text>
    {% if second_line != empty %}<text x="24" y="61" fill="#1f2328" font-size="18" font-weight="600">{{ second_line | xml_escape }}</text>{% endif %}
    <text x="24" y="{{ metadata_y }}" fill="#656d76" font-size="11">Choi's dev-log</text>
    <text x="616" y="{{ metadata_y }}" text-anchor="end" fill="#656d76" font-size="12">{{ post.date | date: '%Y.%m.%d' }}</text>
  </g>
</svg>
